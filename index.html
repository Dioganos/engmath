.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:20px;max-width:1320px;margin:0 auto}
main{min-width:0}aside{max-height:calc(100vh - 92px);overflow:auto;position:sticky;top:72px;align-self:start}

h2{font-size:1.4rem;margin:4px 0 4px}.sub{color:var(--mut);font-size:.9rem;margin:0 0 10px}
.bk{font-size:.82rem;margin:-6px 0 10px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.lnk{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
button:hover,.lnk:hover{border-color:var(--ac)}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
summary small{color:var(--mut);font-weight:400}
.it{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--bd);border-radius:0;padding:7px 12px;font-size:.88rem;background:none}.it:hover{background:var(--acbg)}

@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:12px;gap:16px}aside{position:static;max-height:none}}
