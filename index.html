  x[1].forEach(t=>{const dur=D[t[1]]?'<span class="d">'+fmt(D[t[1]])+'</span>':'';s+='<button class="it'+(k===cur?' on':'')+'" data-k="'+k+'"><span class="c">'+(done[t[1]+t[0]]?'✓':'')+'</span>'+t[0]+dur+'</button>';k++});
  s+='</details>'});
 $('s').innerHTML=s;
 $('s').querySelectorAll('.it').forEach(b=>b.onclick=()=>go(+b.dataset.k));
 const nd=Object.keys(done).length;
 let wd=0,wt=0;W.forEach(x=>{x[1].forEach(t=>{if(D[t[1]]){const sec=D[t[1]];if(done[t[1]+t[0]])wd+=sec;wt+=sec}})});
 const wstr=wt>0?' · '+(wd>0?fmtW(wd)+' / ':'')+(fmtW(wt)):'';
 $('pg').textContent=nd+' / '+flat.length+' tamamlandı'+wstr;$('bi').style.width=(100*nd/flat.length)+'%';
}
const nm=t=>t.toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmt=s=>{const m=Math.floor(s/60),ss=s%60;return m>0?m+'m '+String(ss).padStart(2,'0')+'s':ss+'s'};
const fmtW=s=>s>=3600?Math.floor(s/3600)+'s '+Math.floor(s%3600/60)+'dk':Math.floor(s/60)+'dk';
flat.forEach(f=>f.t=nm(f.n+' '+W[f.wi][0]));
let sr=[],hl=0;const q=$('q'),sl=$('sl');
function sc(){sl.classList.remove('on');hl=0}
function sh(){sl.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('h',i===hl));const d=sl.children[hl];if(d&&d.scrollIntoView)d.scrollIntoView({block:'nearest'})}
function sf(){const w=nm(q.value).split(/\s+/).filter(Boolean);if(!w.length){sc();return}
 sr=[];for(let k=0;k<flat.length&&sr.length<10;k++)if(w.every(x=>flat[k].t.includes(x)))sr.push(k);
 hl=0;sl.innerHTML=sr.length?sr.map(k=>'<div data-k="'+k+'">'+flat[k].n+'<small>'+W[flat[k].wi][0]+'</small></div>').join(''):'<div class="e">Sonuç yok</div>';
 sl.classList.add('on');sh()}
function sp(k){q.value='';sc();q.blur();go(k)}
q.oninput=sf;q.onfocus=()=>{if(q.value)sf()};

sl.onclick=e=>{const d=e.target.closest('div[data-k]');if(d)sp(+d.dataset.k)};
