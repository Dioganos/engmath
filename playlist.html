const flat=[];
G.forEach((g,gi)=>g[1].forEach(v=>flat.push({gi,id:v[0],n:v[1]})));
const $=id=>document.getElementById(id);
const KEY='plc';
let cur=0,player=null,ready=false,errRun=0;
try{const sv=localStorage.getItem(KEY);const i=sv?flat.findIndex(v=>v.id===sv):-1;if(i>=0)cur=i}catch(e){}
function save(){try{localStorage.setItem(KEY,flat[cur].id)}catch(e){}}
function build(){
 let s='',k=0;
 G.forEach(g=>{
  s+='<div class="grp"><h3>'+g[0]+' <small>('+g[1].length+' video)</small></h3>';
  g[1].forEach((v,j)=>{s+='<button class="it" data-k="'+k+'"><span class="n">'+(j+1)+'</span>'+v[1].replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</button>';k++});
  s+='</div>';
 });
 $('s').innerHTML=s;
 $('s').querySelectorAll('.it').forEach(b=>b.onclick=()=>play(+b.dataset.k));
}
function mark(scroll){
 const v=flat[cur];
 $('t').textContent=v.n;
 $('st').textContent=G[v.gi][0]+' · '+(cur+1)+' / '+flat.length;
 $('pg').textContent=(cur+1)+' / '+flat.length;
 document.title=v.n+' — Oynatma Listesi';
 $('s').querySelectorAll('.it').forEach(b=>{
  const on=+b.dataset.k===cur;
  b.classList.toggle('on',on);
  if(on&&scroll){
   const a=$('s');
   if(a.scrollHeight>a.clientHeight+2){a.scrollTo({top:b.offsetTop-a.offsetTop-a.clientHeight/2+b.offsetHeight/2,behavior:'smooth'})}
   else b.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
 });
}
function play(i,auto){
 cur=((i%flat.length)+flat.length)%flat.length;
 save();mark(true);
 if(!ready)return;
 if(auto===false)player.cueVideoById(flat[cur].id);
 else player.loadVideoById(flat[cur].id);
}
function next(){play(cur+1)}
$('pv').onclick=()=>play(cur-1);
$('nx').onclick=next;
function onYouTubeIframeAPIReady(){
 player=new YT.Player('pl',{
  width:'100%',height:'100%',videoId:flat[cur].id,
  playerVars:{rel:0,modestbranding:1,playsinline:1},
  events:{
   onReady:()=>{ready=true},
   onStateChange:e=>{
    if(e.data===YT.PlayerState.ENDED){errRun=0;next()}
    else if(e.data===YT.PlayerState.PLAYING)errRun=0;
   },
   onError:()=>{
    errRun++;
    if(errRun>=flat.length){errRun=0;return}
    next();
   }
  }
 });
}
build();mark(true);
(function(){const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)})();
